<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>図書館の利用案内</title>
  </head>
  <body>
    <h1>図書館の利用案内</h1>
      <h2>図書館について</h2>
      <p>図書館では、授業や学習に役立つ資料を利用できます。</p>
      <h2>利用するときの案内</h2>
        <h3>本を借りる</h3>
        <p>貸し出しの手続きや必要なものは、<a href="https://appsv.main.teikyo-u.ac.jp/tosho/tos.html">図書館の公式サイト</a>で確認してください。</p>
        <h3>館内で学習する</h3>
        <p>周りの人の学習の妨げにならないように過ごしましょう。</p>
      <h2>詳しい情報</h2>
      <p>閉館日や利用方法の詳細は、本学の<a href="https://appsv.main.teikyo-u.ac.jp/tosho/tos.html">図書館の公式サイト</a>で確認してください。</p>
      <p><a href="https://appsv.main.teikyo-u.ac.jp/tosho/tos.html">本学図書館の公式サイト</a></p>
  </body>
</html>

<!--
インデントの考え方
- html の直下にある head と body は、1段階(2スペース)下げます。
- head の中の meta と title は、さらに1段階下げます。
- body の中の h1 と p も、同じ深さにそろえます。
- 開始タグと終了タグ(<head> と </head> など)は、同じ位置にそろえます。
- <!DOCTYPE html> は要素ではないので、インデントしません。
-->
